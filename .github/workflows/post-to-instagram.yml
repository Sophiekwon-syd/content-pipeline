name: Post to Instagram
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date directory (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      slug:
        description: 'Single topic slug to post (optional). Leave empty to post all.'
        required: false
        default: ''
  workflow_call:
    inputs:
      date:
        required: true
        type: string
      slug:
        required: true
        type: string
    secrets:
      IG_ACCESS_TOKEN:
        required: true
      IG_USER_ID:
        required: true
      THREAD_ACCESS_TOKEN:
        required: true
      THREADS_USER_ID:
        required: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Post carousels to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          node scripts/post-to-instagram.mjs $ARGS
      - name: Commit instagram-log.json
        run: |
          shopt -s nullglob
          files=(outputs/*/instagram-log.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No instagram-log.json files — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -f "${files[@]}"   # outputs/ is gitignored — force-add the log
          git diff --cached --quiet || git commit -m "instagram: posted from content-pipeline"
          git push origin main

  threads:
    needs: post
    if: ${{ (inputs.date || github.event.inputs.date) != '' && (inputs.slug || github.event.inputs.slug) != '' }}
    uses: ./.github/workflows/post-to-threads.yml
    with:
      date: ${{ inputs.date || github.event.inputs.date }}
      slug: ${{ inputs.slug || github.event.inputs.slug }}
    secrets: inherit
